<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maze Architecture Framework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg-app: #f4f4f5;
      --bg-surface: #ffffff;
      --bg-subtle: #fafafa;
      --bg-hover: #f0f0f2;
      --border: #e4e4e7;
      --border-strong: #18181b;
      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --btn-primary-bg: #09090b;
      --btn-primary-text: #ffffff;
      --btn-primary-hover: #27272a;
      --canvas-bg: #f4f4f5;
      --maze-wall: #09090b;
      --maze-empty: #ffffff;
      --maze-grid: #e4e4e7;
      --maze-visited: #e4e4e7;
      --maze-path: #71717a;
      --maze-start: #09090b;
      --maze-end: #52525b;
      --maze-marker-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-app: #09090b;
      --bg-surface: #111113;
      --bg-subtle: #18181b;
      --bg-hover: #27272a;
      --border: #27272a;
      --border-strong: #f4f4f5;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --btn-primary-bg: #fafafa;
      --btn-primary-text: #09090b;
      --btn-primary-hover: #e4e4e7;
      --canvas-bg: #09090b;
      --maze-wall: #27272a;
      --maze-empty: #09090b;
      --maze-grid: #18181b;
      --maze-visited: #1e293b;
      --maze-path: #e4e4e7;
      --maze-start: #fafafa;
      --maze-end: #71717a;
      --maze-marker-text: #09090b;
    }

    [data-theme="neon"] {
      --bg-app: #07080d;
      --bg-surface: #0e1017;
      --bg-subtle: #141722;
      --bg-hover: #1e2233;
      --border: #23283b;
      --border-strong: #22d3ee;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --btn-primary-bg: #22d3ee;
      --btn-primary-text: #07080d;
      --btn-primary-hover: #06b6d4;
      --canvas-bg: #07080d;
      --maze-wall: #1e293b;
      --maze-empty: #07080d;
      --maze-grid: #0f172a;
      --maze-visited: #1e1b4b;
      --maze-path: #22d3ee;
      --maze-start: #10b981;
      --maze-end: #f43f5e;
      --maze-marker-text: #07080d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Bar */
    .topbar {
      height: 52px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 20px;
      height: 20px;
      border: 2px solid var(--text-primary);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 2px;
      gap: 2px;
    }

    .brand-mark span {
      background: var(--text-primary);
    }

    .brand-mark span:nth-child(2) {
      background: transparent;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      padding-left: 10px;
      border-left: 1px solid var(--border);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Segmented Theme Switcher */
    .segmented {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .seg-btn:hover {
      color: var(--text-primary);
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    .repo-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.12s ease;
    }

    .repo-link:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 288px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .primary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.12s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--btn-primary-hover);
    }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    select, input[type="number"] {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--border-strong);
      background: var(--bg-surface);
    }

    .size-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .preset-btn {
      height: 30px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .preset-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .preset-btn.active {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border-color: var(--btn-primary-bg);
    }

    .custom-dims {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 6px;
    }

    .custom-dims span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .custom-dims input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: center;
      padding: 0 4px;
    }

    .metrics-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .metric-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .shortcuts-hint {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .shortcuts-hint kbd {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      color: var(--text-secondary);
      font-size: 10px;
    }

    /* Viewport */
    .viewport {
      flex: 1;
      position: relative;
      background: var(--canvas-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Floating Canvas Controls */
    .canvas-hud-top {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .canvas-hud-bottom {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      z-index: 10;
      white-space: nowrap;
    }

    .zoom-controls {
      display: inline-flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .zoom-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-btn:hover {
      background: var(--bg-hover);
    }

    .zoom-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      padding: 0 8px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-width: 50px;
      text-align: center;
      cursor: pointer;
    }

    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 5px;
      border: 1px solid var(--border);
      vertical-align: middle;
    }

    @media (max-width: 820px) {
      body { height: auto; overflow: auto; }
      .workspace { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .viewport { height: 65vh; min-height: 400px; }
      .brand-sub { display: none; }
      .canvas-hud-bottom { font-size: 11px; gap: 10px; padding: 5px 10px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
      <span class="brand-title">Maze Architecture</span>
      <span class="brand-sub">Generator &amp; Pathfinder Engine</span>
    </div>

    <div class="topbar-right">
      <div class="segmented" role="group" aria-label="Theme">
        <button class="seg-btn active" data-theme-set="light">Light</button>
        <button class="seg-btn" data-theme-set="dark">Dark</button>
        <button class="seg-btn" data-theme-set="neon">Neon</button>
      </div>
      <a class="repo-link" href="https://github.com/RushilMahadevu/maze-architecture-framework" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <!-- Primary Actions -->
      <div>
        <div class="primary-actions">
          <button id="btn-generate" class="btn btn-primary">Generate</button>
          <button id="btn-solve" class="btn btn-primary">Solve</button>
        </div>
        <div class="primary-actions" style="margin-top: 8px;">
          <button id="btn-clear" class="btn btn-secondary">Clear Path</button>
          <button id="btn-blank" class="btn btn-secondary">Blank Grid</button>
        </div>
      </div>

      <!-- Dimensions -->
      <div>
        <div class="section-title">Dimensions</div>
        <div class="size-presets">
          <button class="preset-btn" data-w="11" data-h="11">11</button>
          <button class="preset-btn active" data-w="21" data-h="21">21</button>
          <button class="preset-btn" data-w="41" data-h="41">41</button>
          <button class="preset-btn" data-w="61" data-h="61">61</button>
        </div>
        <div class="custom-dims">
          <input type="number" id="input-width" min="5" max="101" step="2" value="21" aria-label="Width">
          <span>×</span>
          <input type="number" id="input-height" min="5" max="101" step="2" value="21" aria-label="Height">
          <button id="btn-apply-size" class="btn btn-secondary" style="height: 34px; padding: 0 10px;">Set</button>
        </div>
      </div>

      <!-- Algorithms -->
      <div>
        <div class="section-title">Algorithms</div>
        <div class="field">
          <label for="generator-select">Generator</label>
          <select id="generator-select">
            <option value="iterative" selected>Iterative Backtracker</option>
            <option value="recursive">Recursive Backtracker</option>
          </select>
        </div>
        <div class="field">
          <label for="pathfinder-select">Pathfinder</label>
          <select id="pathfinder-select">
            <option value="astar" selected>A* (Manhattan)</option>
            <option value="bfs">BFS (Shortest Path)</option>
            <option value="dijkstra">Dijkstra</option>
            <option value="deadend">Dead-End Filler</option>
          </select>
        </div>
        <div class="field">
          <label for="speed-select">Animation Speed</label>
          <select id="speed-select">
            <option value="instant">Instant</option>
            <option value="fast" selected>Fast</option>
            <option value="medium">Medium</option>
            <option value="slow">Step-by-Step</option>
          </select>
        </div>
      </div>

      <!-- Metrics -->
      <div>
        <div class="section-title">Metrics</div>
        <div class="metrics-card">
          <div>
            <div class="metric-label">Status</div>
            <div id="metric-status" class="metric-val">Ready</div>
          </div>
          <div>
            <div class="metric-label">Path Steps</div>
            <div id="metric-steps" class="metric-val">0</div>
          </div>
          <div>
            <div class="metric-label">Visited</div>
            <div id="metric-visited" class="metric-val">0</div>
          </div>
          <div>
            <div class="metric-label">Time</div>
            <div id="metric-time" class="metric-val">0 ms</div>
          </div>
        </div>
      </div>

      <!-- Export -->
      <div>
        <div class="section-title">Export</div>
        <div class="primary-actions">
          <button id="btn-export-png" class="btn btn-secondary">PNG (2×)</button>
          <button id="btn-export-json" class="btn btn-secondary">JSON</button>
        </div>
      </div>

      <div class="shortcuts-hint">
        <kbd>G</kbd> Generate · <kbd>S</kbd> Solve · <kbd>C</kbd> Clear · <kbd>Scroll</kbd> Zoom · <kbd>Right-Drag</kbd> Pan
      </div>
    </aside>

    <!-- HiDPI Canvas Viewport -->
    <main class="viewport" id="viewport">
      <div class="canvas-hud-top">
        <div class="segmented" role="group" aria-label="Interaction Mode">
          <button class="seg-btn active" data-mode="draw">Draw Walls</button>
          <button class="seg-btn" data-mode="pan">Pan</button>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out">-</button>
          <span class="zoom-readout" id="zoom-readout" title="Reset Zoom">100%</span>
          <button class="zoom-btn" id="btn-zoom-in" title="Zoom In">+</button>
          <button class="zoom-btn" id="btn-zoom-fit" title="Fit to Screen" style="border-left: 1px solid var(--border); font-size: 11px; width: 38px;">Fit</button>
        </div>
      </div>

      <canvas id="mazeCanvas"></canvas>

      <div class="canvas-hud-bottom">
        <span><span class="legend-dot" style="background: var(--maze-wall);"></span>Wall</span>
        <span><span class="legend-dot" style="background: var(--maze-start);"></span>Start</span>
        <span><span class="legend-dot" style="background: var(--maze-end);"></span>End</span>
        <span><span class="legend-dot" style="background: var(--maze-visited);"></span>Visited</span>
        <span><span class="legend-dot" style="background: var(--maze-path);"></span>Path</span>
      </div>
    </main>
  </div>

  <script>
    const CellType = { EMPTY: 0, WALL: 1, START: 2, END: 3 };

    class MazeEngine {
      constructor(width = 21, height = 21) {
        this.width = width;
        this.height = height;
        this.grid = [];
        this.startPos = { x: 1, y: 1 };
        this.endPos = { x: width - 2, y: height - 2 };
        this.visitedNodes = [];
        this.solutionPath = [];
        this.resetGrid(CellType.WALL);
      }

      resetGrid(fillType = CellType.WALL) {
        this.grid = Array.from({ length: this.height }, () => Array(this.width).fill(fillType));
        this.visitedNodes = [];
        this.solutionPath = [];

        for (let x = 0; x < this.width; x++) {
          this.grid[0][x] = CellType.WALL;
          this.grid[this.height - 1][x] = CellType.WALL;
        }
        for (let y = 0; y < this.height; y++) {
          this.grid[y][0] = CellType.WALL;
          this.grid[y][this.width - 1] = CellType.WALL;
        }

        this.startPos = { x: 1, y: 1 };
        this.endPos = { x: this.width - 2, y: this.height - 2 };
        this.grid[this.startPos.y][this.startPos.x] = CellType.START;
        this.grid[this.endPos.y][this.endPos.x] = CellType.END;
      }

      *generateBacktracker() {
        this.resetGrid(CellType.WALL);
        const stack = [{ x: this.startPos.x, y: this.startPos.y }];
        const visited = new Set([`${this.startPos.x},${this.startPos.y}`]);
        const dirs = [{ dx: 2, dy: 0 }, { dx: 0, dy: 2 }, { dx: -2, dy: 0 }, { dx: 0, dy: -2 }];

        while (stack.length > 0) {
          const current = stack[stack.length - 1];
          const neighbors = [];

          for (const d of dirs) {
            const nx = current.x + d.dx;
            const ny = current.y + d.dy;
            if (nx > 0 && nx < this.width - 1 && ny > 0 && ny < this.height - 1 && !visited.has(`${nx},${ny}`)) {
              neighbors.push({ x: nx, y: ny, wx: current.x + d.dx / 2, wy: current.y + d.dy / 2 });
            }
          }

          if (neighbors.length > 0) {
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            this.grid[next.wy][next.wx] = CellType.EMPTY;
            this.grid[next.y][next.x] = CellType.EMPTY;
            visited.add(`${next.x},${next.y}`);
            stack.push({ x: next.x, y: next.y });
            yield;
          } else {
            stack.pop();
          }
        }

        if (this.grid[this.endPos.y][this.endPos.x - 1] === CellType.WALL &&
            this.grid[this.endPos.y - 1][this.endPos.x] === CellType.WALL) {
          if (Math.random() > 0.5 && this.endPos.x > 1) {
            this.grid[this.endPos.y][this.endPos.x - 1] = CellType.EMPTY;
          } else if (this.endPos.y > 1) {
            this.grid[this.endPos.y - 1][this.endPos.x] = CellType.EMPTY;
          }
        }

        this.grid[this.startPos.y][this.startPos.x] = CellType.START;
        this.grid[this.endPos.y][this.endPos.x] = CellType.END;
      }

      *solveBFS() {
        const queue = [[this.startPos]];
        const visited = new Set([`${this.startPos.x},${this.startPos.y}`]);
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (queue.length > 0) {
          const path = queue.shift();
          const curr = path[path.length - 1];
          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = path;
            return path;
          }

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const key = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(key) && this.grid[ny][nx] !== CellType.WALL) {
              visited.add(key);
              this.visitedNodes.push({ x: nx, y: ny });
              queue.push([...path, { x: nx, y: ny }]);
              yield;
            }
          }
        }
        return null;
      }

      *solveAStar() {
        const h = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
        const openSet = [{ pos: this.startPos, g: 0, f: h(this.startPos, this.endPos), path: [this.startPos] }];
        const visited = new Set();
        const gScores = new Map([[`${this.startPos.x},${this.startPos.y}`, 0]]);
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (openSet.length > 0) {
          openSet.sort((a, b) => a.f - b.f);
          const current = openSet.shift();
          const curr = current.pos;
          const currKey = `${curr.x},${curr.y}`;

          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = current.path;
            return current.path;
          }
          if (visited.has(currKey)) continue;
          visited.add(currKey);

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const nextKey = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(nextKey) && this.grid[ny][nx] !== CellType.WALL) {
              const g = current.g + 1;
              if (!gScores.has(nextKey) || g < gScores.get(nextKey)) {
                gScores.set(nextKey, g);
                openSet.push({ pos: { x: nx, y: ny }, g, f: g + h({ x: nx, y: ny }, this.endPos), path: [...current.path, { x: nx, y: ny }] });
                this.visitedNodes.push({ x: nx, y: ny });
                yield;
              }
            }
          }
        }
        return null;
      }

      *solveDijkstra() {
        const pq = [{ pos: this.startPos, dist: 0, path: [this.startPos] }];
        const visited = new Set();
        const dists = new Map([[`${this.startPos.x},${this.startPos.y}`, 0]]);
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (pq.length > 0) {
          pq.sort((a, b) => a.dist - b.dist);
          const current = pq.shift();
          const curr = current.pos;
          const currKey = `${curr.x},${curr.y}`;

          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = current.path;
            return current.path;
          }
          if (visited.has(currKey)) continue;
          visited.add(currKey);

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const nextKey = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(nextKey) && this.grid[ny][nx] !== CellType.WALL) {
              const dist = current.dist + 1;
              if (!dists.has(nextKey) || dist < dists.get(nextKey)) {
                dists.set(nextKey, dist);
                pq.push({ pos: { x: nx, y: ny }, dist, path: [...current.path, { x: nx, y: ny }] });
                this.visitedNodes.push({ x: nx, y: ny });
                yield;
              }
            }
          }
        }
        return null;
      }

      *solveDeadEnd() {
        const working = this.grid.map(r => [...r]);
        let changed = true;
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (changed) {
          changed = false;
          for (let y = 1; y < this.height - 1; y++) {
            for (let x = 1; x < this.width - 1; x++) {
              if (working[y][x] === CellType.WALL) continue;
              if ((x === this.startPos.x && y === this.startPos.y) || (x === this.endPos.x && y === this.endPos.y)) continue;
              let passable = 0;
              for (const d of dirs) {
                if (working[y + d.dy][x + d.dx] !== CellType.WALL) passable++;
              }
              if (passable <= 1) {
                working[y][x] = CellType.WALL;
                this.visitedNodes.push({ x, y });
                changed = true;
                yield;
              }
            }
          }
        }

        const queue = [[this.startPos]];
        const visited = new Set([`${this.startPos.x},${this.startPos.y}`]);
        while (queue.length > 0) {
          const path = queue.shift();
          const curr = path[path.length - 1];
          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = path;
            return path;
          }
          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const key = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(key) && working[ny][nx] !== CellType.WALL) {
              visited.add(key);
              queue.push([...path, { x: nx, y: ny }]);
            }
          }
        }
        return null;
      }
    }

    // DOM Elements
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');

    const metricStatus = document.getElementById('metric-status');
    const metricSteps = document.getElementById('metric-steps');
    const metricVisited = document.getElementById('metric-visited');
    const metricTime = document.getElementById('metric-time');
    const zoomReadout = document.getElementById('zoom-readout');

    const btnGenerate = document.getElementById('btn-generate');
    const btnSolve = document.getElementById('btn-solve');
    const btnClear = document.getElementById('btn-clear');
    const btnBlank = document.getElementById('btn-blank');
    const btnApplySize = document.getElementById('btn-apply-size');
    const inputWidth = document.getElementById('input-width');
    const inputHeight = document.getElementById('input-height');
    const pathfinderSelect = document.getElementById('pathfinder-select');
    const speedSelect = document.getElementById('speed-select');
    const presetButtons = document.querySelectorAll('.preset-btn');

    let engine = new MazeEngine(21, 21);
    let isRunning = false;
    let interactionMode = 'draw'; // 'draw' | 'pan'

    // Camera / HiDPI state
    let dpr = window.devicePixelRatio || 1;
    let viewW = 800;
    let viewH = 600;
    let baseCellSize = 24;
    let zoom = 1;
    let panX = 0;
    let panY = 0;

    function getThemeColors() {
      const s = getComputedStyle(document.documentElement);
      return {
        bg: s.getPropertyValue('--canvas-bg').trim(),
        wall: s.getPropertyValue('--maze-wall').trim(),
        empty: s.getPropertyValue('--maze-empty').trim(),
        grid: s.getPropertyValue('--maze-grid').trim(),
        visited: s.getPropertyValue('--maze-visited').trim(),
        path: s.getPropertyValue('--maze-path').trim(),
        start: s.getPropertyValue('--maze-start').trim(),
        end: s.getPropertyValue('--maze-end').trim(),
        markerText: s.getPropertyValue('--maze-marker-text').trim(),
        border: s.getPropertyValue('--border').trim()
      };
    }

    function resizeViewport(refit = false) {
      dpr = window.devicePixelRatio || 1;
      const rect = viewport.getBoundingClientRect();
      viewW = Math.max(300, rect.width);
      viewH = Math.max(300, rect.height);

      canvas.width = Math.round(viewW * dpr);
      canvas.height = Math.round(viewH * dpr);
      canvas.style.width = `${viewW}px`;
      canvas.style.height = `${viewH}px`;

      if (refit) fitToScreen();
      else render();
    }

    function fitToScreen() {
      const pad = 96;
      const availW = Math.max(100, viewW - pad);
      const availH = Math.max(100, viewH - pad - 24);
      baseCellSize = Math.min(availW / engine.width, availH / engine.height);
      zoom = 1;
      panX = (viewW - engine.width * baseCellSize) / 2;
      panY = (viewH - engine.height * baseCellSize) / 2;
      updateZoomReadout();
      render();
    }

    function updateZoomReadout() {
      zoomReadout.textContent = `${Math.round(zoom * 100)}%`;
    }

    function render() {
      const colors = getThemeColors();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, viewW, viewH);

      const cellSize = baseCellSize * zoom;
      const visitedSet = new Set(engine.visitedNodes.map(p => `${p.x},${p.y}`));
      const solutionSet = new Set(engine.solutionPath.map(p => `${p.x},${p.y}`));

      // Crisp outer frame
      const totalW = Math.round(engine.width * cellSize);
      const totalH = Math.round(engine.height * cellSize);
      const originX = Math.round(panX);
      const originY = Math.round(panY);

      ctx.fillStyle = colors.empty;
      ctx.fillRect(originX, originY, totalW, totalH);

      for (let y = 0; y < engine.height; y++) {
        const y0 = Math.round(originY + y * cellSize);
        const y1 = Math.round(originY + (y + 1) * cellSize);
        const ch = y1 - y0;

        for (let x = 0; x < engine.width; x++) {
          const x0 = Math.round(originX + x * cellSize);
          const x1 = Math.round(originX + (x + 1) * cellSize);
          const cw = x1 - x0;

          const type = engine.grid[y][x];
          const key = `${x},${y}`;

          if (type === CellType.WALL) {
            ctx.fillStyle = colors.wall;
            ctx.fillRect(x0, y0, cw, ch);
          } else {
            if (type === CellType.START) {
              ctx.fillStyle = colors.start;
              ctx.fillRect(x0, y0, cw, ch);
            } else if (type === CellType.END) {
              ctx.fillStyle = colors.end;
              ctx.fillRect(x0, y0, cw, ch);
            } else if (solutionSet.has(key)) {
              ctx.fillStyle = colors.path;
              ctx.fillRect(x0, y0, cw, ch);
            } else if (visitedSet.has(key)) {
              ctx.fillStyle = colors.visited;
              ctx.fillRect(x0, y0, cw, ch);
            }

            if (cellSize >= 10 && type !== CellType.START && type !== CellType.END) {
              ctx.strokeStyle = colors.grid;
              ctx.lineWidth = 1;
              ctx.strokeRect(x0 + 0.5, y0 + 0.5, cw - 1, ch - 1);
            }

            if ((type === CellType.START || type === CellType.END) && cellSize >= 10) {
              ctx.fillStyle = colors.markerText;
              ctx.font = `600 ${Math.max(8, Math.floor(cellSize * 0.52))}px Inter, sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(type === CellType.START ? 'S' : 'E', x0 + cw / 2, y0 + ch / 2 + 0.5);
            }
          }
        }
      }

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.strokeRect(originX - 0.5, originY - 0.5, totalW + 1, totalH + 1);
    }

    function updateMetrics(status, elapsedMs = 0) {
      metricStatus.textContent = status;
      metricSteps.textContent = engine.solutionPath.length;
      metricVisited.textContent = engine.visitedNodes.length;
      metricTime.textContent = `${elapsedMs} ms`;
    }

    function setDisabled(disabled) {
      btnGenerate.disabled = disabled;
      btnSolve.disabled = disabled;
      btnClear.disabled = disabled;
      btnBlank.disabled = disabled;
    }

    function runStepwise(gen, doneLabel) {
      if (isRunning) return;
      const speed = speedSelect.value;
      const t0 = performance.now();

      if (speed === 'instant') {
        while (!gen.next().done) {}
        render();
        updateMetrics(doneLabel, Math.round(performance.now() - t0));
        return;
      }

      isRunning = true;
      setDisabled(true);
      const stepsPerFrame = speed === 'fast' ? 10 : speed === 'medium' ? 3 : 1;

      function tick() {
        for (let i = 0; i < stepsPerFrame; i++) {
          if (gen.next().done) {
            isRunning = false;
            setDisabled(false);
            render();
            updateMetrics(doneLabel, Math.round(performance.now() - t0));
            return;
          }
        }
        render();
        updateMetrics('Running...', Math.round(performance.now() - t0));
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function generateMaze() {
      if (isRunning) return;
      engine.visitedNodes = [];
      engine.solutionPath = [];
      updateMetrics('Generating');
      runStepwise(engine.generateBacktracker(), 'Ready');
    }

    function solveMaze() {
      if (isRunning) return;
      engine.visitedNodes = [];
      engine.solutionPath = [];
      render();

      const algo = pathfinderSelect.value;
      let gen;
      if (algo === 'astar') gen = engine.solveAStar();
      else if (algo === 'bfs') gen = engine.solveBFS();
      else if (algo === 'dijkstra') gen = engine.solveDijkstra();
      else gen = engine.solveDeadEnd();

      updateMetrics('Solving');
      runStepwise(gen, engine.solutionPath.length >= 0 ? 'Done' : 'No Path');
    }

    function setSize(w, h) {
      if (isRunning) return;
      const cw = Math.max(5, Math.min(101, w % 2 === 0 ? w + 1 : w));
      const ch = Math.max(5, Math.min(101, h % 2 === 0 ? h + 1 : h));
      inputWidth.value = cw;
      inputHeight.value = ch;
      engine = new MazeEngine(cw, ch);
      fitToScreen();
      generateMaze();
    }

    // Zoom & Pan Logic
    function applyZoom(factor, centerX = viewW / 2, centerY = viewH / 2) {
      const nextZoom = Math.max(0.25, Math.min(6, zoom * factor));
      const actualFactor = nextZoom / zoom;
      panX = centerX - (centerX - panX) * actualFactor;
      panY = centerY - (centerY - panY) * actualFactor;
      zoom = nextZoom;
      updateZoomReadout();
      render();
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      applyZoom(factor, mx, my);
    }, { passive: false });

    document.getElementById('btn-zoom-in').addEventListener('click', () => applyZoom(1.25));
    document.getElementById('btn-zoom-out').addEventListener('click', () => applyZoom(0.8));
    document.getElementById('btn-zoom-fit').addEventListener('click', fitToScreen);
    zoomReadout.addEventListener('click', fitToScreen);

    // Canvas Pointer (Draw Walls or Pan)
    let isPointerDown = false;
    let isPanning = false;
    let lastPan = { x: 0, y: 0 };
    let drawMode = CellType.WALL;

    function getCellFromPointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const cellSize = baseCellSize * zoom;
      return {
        x: Math.floor((mx - panX) / cellSize),
        y: Math.floor((my - panY) / cellSize)
      };
    }

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
      isPointerDown = true;
      if (e.button === 2 || e.button === 1 || e.altKey || interactionMode === 'pan') {
        isPanning = true;
        lastPan = { x: e.clientX, y: e.clientY };
        canvas.style.cursor = 'grabbing';
        return;
      }
      if (isRunning) return;
      const cell = getCellFromPointer(e.clientX, e.clientY);
      if (cell.x > 0 && cell.x < engine.width - 1 && cell.y > 0 && cell.y < engine.height - 1) {
        if ((cell.x === engine.startPos.x && cell.y === engine.startPos.y) ||
            (cell.x === engine.endPos.x && cell.y === engine.endPos.y)) return;
        drawMode = engine.grid[cell.y][cell.x] === CellType.WALL ? CellType.EMPTY : CellType.WALL;
        engine.grid[cell.y][cell.x] = drawMode;
        render();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPointerDown) return;
      if (isPanning) {
        panX += e.clientX - lastPan.x;
        panY += e.clientY - lastPan.y;
        lastPan = { x: e.clientX, y: e.clientY };
        render();
        return;
      }
      if (isRunning) return;
      const cell = getCellFromPointer(e.clientX, e.clientY);
      if (cell.x > 0 && cell.x < engine.width - 1 && cell.y > 0 && cell.y < engine.height - 1) {
        if ((cell.x === engine.startPos.x && cell.y === engine.startPos.y) ||
            (cell.x === engine.endPos.x && cell.y === engine.endPos.y)) return;
        engine.grid[cell.y][cell.x] = drawMode;
        render();
      }
    });

    window.addEventListener('mouseup', () => {
      isPointerDown = false;
      isPanning = false;
      canvas.style.cursor = interactionMode === 'pan' ? 'grab' : 'crosshair';
    });

    // Mode Switcher (Draw vs Pan)
    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        interactionMode = btn.dataset.mode;
        canvas.style.cursor = interactionMode === 'pan' ? 'grab' : 'crosshair';
      });
    });

    // Theme Switcher
    document.querySelectorAll('[data-theme-set]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-theme', btn.dataset.themeSet);
        render();
      });
    });

    // Buttons & Presets
    btnGenerate.addEventListener('click', generateMaze);
    btnSolve.addEventListener('click', solveMaze);
    btnClear.addEventListener('click', () => {
      if (isRunning) return;
      engine.visitedNodes = [];
      engine.solutionPath = [];
      render();
      updateMetrics('Cleared');
    });
    btnBlank.addEventListener('click', () => {
      if (isRunning) return;
      engine.resetGrid(CellType.EMPTY);
      render();
      updateMetrics('Blank Grid');
    });

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setSize(parseInt(btn.dataset.w), parseInt(btn.dataset.h));
      });
    });

    btnApplySize.addEventListener('click', () => {
      presetButtons.forEach(b => b.classList.remove('active'));
      setSize(parseInt(inputWidth.value) || 21, parseInt(inputHeight.value) || 21);
    });

    // High-Res PNG Export (2x crispness)
    document.getElementById('btn-export-png').addEventListener('click', () => {
      const colors = getThemeColors();
      const scale = 24;
      const off = document.createElement('canvas');
      off.width = engine.width * scale;
      off.height = engine.height * scale;
      const octx = off.getContext('2d');
      octx.fillStyle = colors.empty;
      octx.fillRect(0, 0, off.width, off.height);

      const visitedSet = new Set(engine.visitedNodes.map(p => `${p.x},${p.y}`));
      const solutionSet = new Set(engine.solutionPath.map(p => `${p.x},${p.y}`));

      for (let y = 0; y < engine.height; y++) {
        for (let x = 0; x < engine.width; x++) {
          const t = engine.grid[y][x];
          const key = `${x},${y}`;
          if (t === CellType.WALL) octx.fillStyle = colors.wall;
          else if (t === CellType.START) octx.fillStyle = colors.start;
          else if (t === CellType.END) octx.fillStyle = colors.end;
          else if (solutionSet.has(key)) octx.fillStyle = colors.path;
          else if (visitedSet.has(key)) octx.fillStyle = colors.visited;
          else continue;
          octx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
      const link = document.createElement('a');
      link.download = `maze_${engine.width}x${engine.height}.png`;
      link.href = off.toDataURL('image/png');
      link.click();
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const data = {
        width: engine.width,
        height: engine.height,
        start_position: engine.startPos,
        end_position: engine.endPos,
        grid: engine.grid.map(r => r.map(c => c === CellType.WALL ? '#' : c === CellType.START ? 'S' : c === CellType.END ? 'E' : ' ')),
        solution_path: engine.solutionPath.length > 0 ? engine.solutionPath : null
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `maze_${engine.width}x${engine.height}.json`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
      const k = e.key.toLowerCase();
      if (k === 'g' || e.code === 'Space') { e.preventDefault(); generateMaze(); }
      else if (k === 's') solveMaze();
      else if (k === 'c') btnClear.click();
      else if (k === '=' || k === '+') applyZoom(1.25);
      else if (k === '-') applyZoom(0.8);
      else if (k === '0') fitToScreen();
    });

    window.addEventListener('resize', () => resizeViewport(false));
    resizeViewport(true);
    generateMaze();
  </script>
</body>
</html>
