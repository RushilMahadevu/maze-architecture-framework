<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Generator & Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #ffffff;
      --black: #000000;
      --gray-50: #fcfcfc;
      --gray-100: #f8f8f8;
      --gray-200: #f0f0f0;
      --gray-300: #e0e0e0;
      --gray-400: #a0a0a0;
      --gray-500: #808080;
      --gray-600: #606060;
      --gray-700: #404040;
      --gray-800: #202020;
      --disabled: #c0c0c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--gray-100);
      color: var(--black);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      align-items: stretch;
    }

    /* Left Sidebar matching gui.py */
    .sidebar {
      width: 310px;
      flex-shrink: 0;
      background: var(--white);
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .app-header {
      border-bottom: 1px solid var(--gray-200);
      padding-bottom: 14px;
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--black);
    }

    .app-header p {
      font-size: 12px;
      color: var(--gray-600);
      margin-top: 3px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--gray-600);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-600);
      margin-bottom: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 12px;
      background: var(--black);
      color: var(--white);
      border: 1px solid var(--black);
      border-radius: 2px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--gray-800);
    }

    .btn:active:not(:disabled) {
      background: var(--gray-700);
    }

    .btn:disabled {
      background: var(--disabled);
      border-color: var(--gray-300);
      color: var(--gray-500);
      cursor: not-allowed;
    }

    .btn-outline {
      background: var(--white);
      color: var(--black);
      border: 1px solid var(--gray-300);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--gray-100);
      border-color: var(--black);
    }

    .btn-sm {
      height: 32px;
      font-size: 12px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .preset-btn.active {
      outline: 2px solid var(--black);
      outline-offset: 1px;
    }

    .custom-size-box {
      display: none;
      margin-top: 10px;
      gap: 8px;
      flex-direction: column;
    }

    .custom-size-box.visible {
      display: flex;
    }

    .custom-inputs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    input[type="number"], select {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      background: var(--gray-50);
      border: 1px solid var(--gray-300);
      border-radius: 2px;
      font-family: inherit;
      font-size: 13px;
      color: var(--black);
      outline: none;
    }

    input[type="number"]:focus, select:focus {
      background: var(--white);
      border-color: var(--black);
    }

    select {
      background: var(--white);
      cursor: pointer;
    }

    .control-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .export-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    /* Shortcuts Box matching gui.py */
    .shortcuts-box {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 2px;
      padding: 12px 14px;
    }

    .shortcuts-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--gray-700);
    }

    .shortcuts-list span {
      font-weight: 600;
      color: var(--black);
      display: inline-block;
      min-width: 48px;
    }

    /* Main Canvas Card */
    .main-area {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 480px;
      padding: 12px 0;
    }

    canvas {
      display: block;
      cursor: crosshair;
      background: var(--white);
      border: 1px solid var(--gray-300);
      max-width: 100%;
      height: auto;
    }

    /* Bottom Info Bar matching gui.py */
    .info-bar {
      background: var(--gray-50);
      border: 1px solid var(--gray-300);
      border-radius: 2px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--black);
    }

    .info-metrics {
      font-weight: 500;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--gray-600);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border: 1px solid var(--gray-300);
      display: inline-block;
    }

    .swatch-wall { background: var(--black); border-color: var(--black); }
    .swatch-empty { background: var(--white); }
    .swatch-visited { background: #e8e8e8; }
    .swatch-path { background: var(--gray-500); border-color: var(--gray-500); }
    .swatch-start { background: var(--black); border-color: var(--black); position: relative; }
    .swatch-end { background: var(--gray-700); border-color: var(--gray-700); }

    @media (max-width: 900px) {
      body { padding: 10px; }
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; }
      .canvas-wrapper { min-height: 320px; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Left Control Panel -->
    <aside class="sidebar">
      <div class="app-header">
        <h1>Maze Generator &amp; Solver</h1>
        <p>Maze Architecture Framework</p>
      </div>

      <!-- Size Section -->
      <div>
        <div class="section-label">Size</div>
        <button id="btn-toggle-custom" class="btn btn-sm btn-outline" style="width: 100%;">Custom Size</button>

        <div id="presets-container" class="preset-grid">
          <button class="btn btn-sm preset-btn" data-w="9" data-h="9">9×9</button>
          <button class="btn btn-sm preset-btn" data-w="15" data-h="15">15×15</button>
          <button class="btn btn-sm preset-btn active" data-w="21" data-h="21">21×21</button>
          <button class="btn btn-sm preset-btn" data-w="31" data-h="31">31×31</button>
        </div>

        <div id="custom-size-box" class="custom-size-box">
          <div class="custom-inputs-row">
            <div>
              <label class="field-label" for="input-width">Width</label>
              <input type="number" id="input-width" min="5" max="75" step="2" value="21">
            </div>
            <div>
              <label class="field-label" for="input-height">Height</label>
              <input type="number" id="input-height" min="5" max="75" step="2" value="21">
            </div>
          </div>
          <button id="btn-apply-size" class="btn btn-sm">Apply Size</button>
        </div>
      </div>

      <!-- Algorithms Section -->
      <div>
        <div class="section-label">Algorithms</div>
        <div class="control-stack">
          <div>
            <label class="field-label" for="generator-select">Maze Generator</label>
            <select id="generator-select">
              <option value="iterative" selected>Iterative Recursive Backtrack</option>
              <option value="recursive">Recursive Backtrack</option>
              <option value="blank">Blank Grid (Draw Walls)</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="pathfinder-select">Pathfinding Algorithm</label>
            <select id="pathfinder-select">
              <option value="bfs" selected>BFS</option>
              <option value="astar">A*</option>
              <option value="dijkstra">Dijkstra</option>
              <option value="deadend">Dead-End Filler</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="animation-select">Visualization</label>
            <select id="animation-select">
              <option value="instant">Instant</option>
              <option value="fast" selected>Animated (Fast)</option>
              <option value="step">Animated (Slow)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Actions Section -->
      <div>
        <div class="section-label">Actions</div>
        <div class="action-grid">
          <button id="btn-generate" class="btn">Generate</button>
          <button id="btn-solve" class="btn">Solve</button>
          <button id="btn-clear" class="btn btn-outline">Clear Path</button>
          <button id="btn-export-png" class="btn btn-outline">Export PNG</button>
        </div>
        <div class="export-row">
          <button id="btn-export-json" class="btn btn-sm btn-outline" style="grid-column: span 2;">Export JSON</button>
        </div>
      </div>

      <!-- Keyboard Shortcuts -->
      <div class="shortcuts-box">
        <div class="section-label" style="margin-bottom: 8px;">Keyboard Shortcuts</div>
        <ul class="shortcuts-list">
          <li><span>G</span> Generate maze</li>
          <li><span>S</span> Solve maze</li>
          <li><span>C</span> Clear solution</li>
          <li><span>E</span> Export PNG</li>
          <li><span>Space</span> Quick generate</li>
          <li><span>1-4</span> Size presets</li>
        </ul>
      </div>
    </aside>

    <!-- Right Maze Viewport -->
    <main class="main-area">
      <div class="canvas-wrapper">
        <canvas id="mazeCanvas" width="720" height="720"></canvas>
      </div>

      <div class="info-bar">
        <div id="info-text" class="info-metrics">Maze: 21×21</div>
        <div class="legend">
          <div class="legend-item"><span class="swatch swatch-wall"></span> Wall</div>
          <div class="legend-item"><span class="swatch swatch-empty"></span> Empty</div>
          <div class="legend-item"><span class="swatch swatch-visited"></span> Visited</div>
          <div class="legend-item"><span class="swatch swatch-path"></span> Solution</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const CellType = { EMPTY: 0, WALL: 1, START: 2, END: 3 };

    class MazeEngine {
      constructor(width = 21, height = 21) {
        this.width = width;
        this.height = height;
        this.grid = [];
        this.startPos = { x: 1, y: 1 };
        this.endPos = { x: width - 2, y: height - 2 };
        this.visitedNodes = [];
        this.solutionPath = [];
        this.resetGrid(CellType.WALL);
      }

      resetGrid(fillType = CellType.WALL) {
        this.grid = Array.from({ length: this.height }, () => Array(this.width).fill(fillType));
        this.visitedNodes = [];
        this.solutionPath = [];

        for (let x = 0; x < this.width; x++) {
          this.grid[0][x] = CellType.WALL;
          this.grid[this.height - 1][x] = CellType.WALL;
        }
        for (let y = 0; y < this.height; y++) {
          this.grid[y][0] = CellType.WALL;
          this.grid[y][this.width - 1] = CellType.WALL;
        }

        this.startPos = { x: 1, y: 1 };
        this.endPos = { x: this.width - 2, y: this.height - 2 };
        this.grid[this.startPos.y][this.startPos.x] = CellType.START;
        this.grid[this.endPos.y][this.endPos.x] = CellType.END;
      }

      *generateBacktracker() {
        this.resetGrid(CellType.WALL);
        const stack = [{ x: this.startPos.x, y: this.startPos.y }];
        const visited = new Set([`${this.startPos.x},${this.startPos.y}`]);
        const directions = [
          { dx: 2, dy: 0 },
          { dx: 0, dy: 2 },
          { dx: -2, dy: 0 },
          { dx: 0, dy: -2 }
        ];

        while (stack.length > 0) {
          const current = stack[stack.length - 1];
          const unvisitedNeighbors = [];

          for (const dir of directions) {
            const nx = current.x + dir.dx;
            const ny = current.y + dir.dy;
            if (nx > 0 && nx < this.width - 1 && ny > 0 && ny < this.height - 1 && !visited.has(`${nx},${ny}`)) {
              unvisitedNeighbors.push({
                x: nx, y: ny,
                wx: current.x + dir.dx / 2,
                wy: current.y + dir.dy / 2
              });
            }
          }

          if (unvisitedNeighbors.length > 0) {
            const next = unvisitedNeighbors[Math.floor(Math.random() * unvisitedNeighbors.length)];
            this.grid[next.wy][next.wx] = CellType.EMPTY;
            this.grid[next.y][next.x] = CellType.EMPTY;
            visited.add(`${next.x},${next.y}`);
            stack.push({ x: next.x, y: next.y });
            yield;
          } else {
            stack.pop();
          }
        }

        if (this.grid[this.endPos.y][this.endPos.x - 1] === CellType.WALL &&
            this.grid[this.endPos.y - 1][this.endPos.x] === CellType.WALL) {
          if (Math.random() > 0.5 && this.endPos.x > 1) {
            this.grid[this.endPos.y][this.endPos.x - 1] = CellType.EMPTY;
          } else if (this.endPos.y > 1) {
            this.grid[this.endPos.y - 1][this.endPos.x] = CellType.EMPTY;
          }
        }

        this.grid[this.startPos.y][this.startPos.x] = CellType.START;
        this.grid[this.endPos.y][this.endPos.x] = CellType.END;
      }

      *solveBFS() {
        const queue = [[this.startPos]];
        const visited = new Set([`${this.startPos.x},${this.startPos.y}`]);
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (queue.length > 0) {
          const path = queue.shift();
          const curr = path[path.length - 1];
          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = path;
            return path;
          }

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const key = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(key) && this.grid[ny][nx] !== CellType.WALL) {
              visited.add(key);
              this.visitedNodes.push({ x: nx, y: ny });
              queue.push([...path, { x: nx, y: ny }]);
              yield;
            }
          }
        }
        return null;
      }

      *solveAStar() {
        const h = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
        const openSet = [{ pos: this.startPos, g: 0, f: h(this.startPos, this.endPos), path: [this.startPos] }];
        const visited = new Set();
        const gScores = new Map([[`${this.startPos.x},${this.startPos.y}`, 0]]);
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (openSet.length > 0) {
          openSet.sort((a, b) => a.f - b.f);
          const current = openSet.shift();
          const curr = current.pos;
          const currKey = `${curr.x},${curr.y}`;

          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = current.path;
            return current.path;
          }
          if (visited.has(currKey)) continue;
          visited.add(currKey);

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const nextKey = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(nextKey) && this.grid[ny][nx] !== CellType.WALL) {
              const g = current.g + 1;
              if (!gScores.has(nextKey) || g < gScores.get(nextKey)) {
                gScores.set(nextKey, g);
                openSet.push({ pos: { x: nx, y: ny }, g, f: g + h({ x: nx, y: ny }, this.endPos), path: [...current.path, { x: nx, y: ny }] });
                this.visitedNodes.push({ x: nx, y: ny });
                yield;
              }
            }
          }
        }
        return null;
      }

      *solveDijkstra() {
        const pq = [{ pos: this.startPos, dist: 0, path: [this.startPos] }];
        const visited = new Set();
        const dists = new Map([[`${this.startPos.x},${this.startPos.y}`, 0]]);
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (pq.length > 0) {
          pq.sort((a, b) => a.dist - b.dist);
          const current = pq.shift();
          const curr = current.pos;
          const currKey = `${curr.x},${curr.y}`;

          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = current.path;
            return current.path;
          }
          if (visited.has(currKey)) continue;
          visited.add(currKey);

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const nextKey = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(nextKey) && this.grid[ny][nx] !== CellType.WALL) {
              const dist = current.dist + 1;
              if (!dists.has(nextKey) || dist < dists.get(nextKey)) {
                dists.set(nextKey, dist);
                pq.push({ pos: { x: nx, y: ny }, dist, path: [...current.path, { x: nx, y: ny }] });
                this.visitedNodes.push({ x: nx, y: ny });
                yield;
              }
            }
          }
        }
        return null;
      }

      *solveDeadEnd() {
        const working = this.grid.map(r => [...r]);
        let changed = true;
        const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

        while (changed) {
          changed = false;
          for (let y = 1; y < this.height - 1; y++) {
            for (let x = 1; x < this.width - 1; x++) {
              if (working[y][x] === CellType.WALL) continue;
              if ((x === this.startPos.x && y === this.startPos.y) || (x === this.endPos.x && y === this.endPos.y)) continue;

              let passable = 0;
              for (const d of dirs) {
                if (working[y + d.dy][x + d.dx] !== CellType.WALL) passable++;
              }
              if (passable <= 1) {
                working[y][x] = CellType.WALL;
                this.visitedNodes.push({ x, y });
                changed = true;
                yield;
              }
            }
          }
        }

        const queue = [[this.startPos]];
        const visited = new Set([`${this.startPos.x},${this.startPos.y}`]);
        while (queue.length > 0) {
          const path = queue.shift();
          const curr = path[path.length - 1];
          if (curr.x === this.endPos.x && curr.y === this.endPos.y) {
            this.solutionPath = path;
            return path;
          }
          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            const key = `${nx},${ny}`;
            if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height &&
                !visited.has(key) && working[ny][nx] !== CellType.WALL) {
              visited.add(key);
              queue.push([...path, { x: nx, y: ny }]);
            }
          }
        }
        return null;
      }
    }

    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const infoText = document.getElementById('info-text');
    const btnGenerate = document.getElementById('btn-generate');
    const btnSolve = document.getElementById('btn-solve');
    const btnClear = document.getElementById('btn-clear');
    const btnExportPng = document.getElementById('btn-export-png');
    const btnExportJson = document.getElementById('btn-export-json');
    const generatorSelect = document.getElementById('generator-select');
    const pathfinderSelect = document.getElementById('pathfinder-select');
    const animationSelect = document.getElementById('animation-select');

    const btnToggleCustom = document.getElementById('btn-toggle-custom');
    const presetsContainer = document.getElementById('presets-container');
    const customSizeBox = document.getElementById('custom-size-box');
    const inputWidth = document.getElementById('input-width');
    const inputHeight = document.getElementById('input-height');
    const btnApplySize = document.getElementById('btn-apply-size');
    const presetButtons = document.querySelectorAll('.preset-btn');

    let engine = new MazeEngine(21, 21);
    let isRunning = false;
    let showCustom = false;

    function fitCanvas() {
      const wrapper = document.querySelector('.canvas-wrapper');
      const maxW = Math.min(wrapper.clientWidth - 20, 760);
      const maxH = Math.min(window.innerHeight - 160, 760);
      const cellSize = Math.max(4, Math.floor(Math.min(maxW / engine.width, maxH / engine.height)));
      canvas.width = cellSize * engine.width;
      canvas.height = cellSize * engine.height;
      render();
    }

    function render() {
      const cellW = canvas.width / engine.width;
      const cellH = canvas.height / engine.height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const visitedSet = new Set(engine.visitedNodes.map(p => `${p.x},${p.y}`));
      const solutionSet = new Set(engine.solutionPath.map(p => `${p.x},${p.y}`));

      for (let y = 0; y < engine.height; y++) {
        for (let x = 0; x < engine.width; x++) {
          const type = engine.grid[y][x];
          const px = x * cellW;
          const py = y * cellH;
          const key = `${x},${y}`;

          if (type === CellType.WALL) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(px, py, cellW, cellH);
          } else {
            if (type === CellType.START) {
              ctx.fillStyle = '#000000';
            } else if (type === CellType.END) {
              ctx.fillStyle = '#404040';
            } else if (solutionSet.has(key)) {
              ctx.fillStyle = '#808080';
            } else if (visitedSet.has(key)) {
              ctx.fillStyle = '#e8e8e8';
            } else {
              ctx.fillStyle = '#ffffff';
            }
            ctx.fillRect(px, py, cellW, cellH);

            if (cellW > 8) {
              ctx.strokeStyle = '#e0e0e0';
              ctx.lineWidth = 1;
              ctx.strokeRect(px + 0.5, py + 0.5, cellW - 1, cellH - 1);
            }

            if (type === CellType.START || type === CellType.END) {
              ctx.fillStyle = '#ffffff';
              ctx.font = `600 ${Math.max(8, Math.floor(cellW * 0.55))}px Inter, sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(type === CellType.START ? 'S' : 'E', px + cellW / 2, py + cellH / 2 + 0.5);
            }
          }
        }
      }
    }

    function updateInfo(statusPrefix = '') {
      let text = `Maze: ${engine.width}×${engine.height}`;
      if (engine.solutionPath.length > 0) {
        text += `  •  Solution: ${engine.solutionPath.length} steps`;
      }
      if (engine.visitedNodes.length > 0) {
        text += `  •  Visited: ${engine.visitedNodes.length}`;
      }
      if (statusPrefix) {
        text = `${statusPrefix}  •  ${text}`;
      }
      infoText.textContent = text;
    }

    function setDisabled(disabled) {
      btnGenerate.disabled = disabled;
      btnSolve.disabled = disabled;
      btnClear.disabled = disabled;
    }

    function runStepwise(gen, onDone) {
      if (isRunning) return;
      const mode = animationSelect.value;

      if (mode === 'instant') {
        while (!gen.next().done) {}
        render();
        onDone();
        return;
      }

      isRunning = true;
      setDisabled(true);
      const stepsPerFrame = mode === 'fast' ? 8 : 1;

      function tick() {
        for (let i = 0; i < stepsPerFrame; i++) {
          if (gen.next().done) {
            isRunning = false;
            setDisabled(false);
            render();
            onDone();
            return;
          }
        }
        render();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function generateMaze() {
      if (isRunning) return;
      engine.visitedNodes = [];
      engine.solutionPath = [];
      if (generatorSelect.value === 'blank') {
        engine.resetGrid(CellType.EMPTY);
        render();
        updateInfo('Blank Grid');
        return;
      }
      updateInfo('Generating...');
      runStepwise(engine.generateBacktracker(), () => updateInfo('Ready'));
    }

    function solveMaze() {
      if (isRunning) return;
      engine.visitedNodes = [];
      engine.solutionPath = [];
      render();

      const algo = pathfinderSelect.value;
      let gen;
      if (algo === 'bfs') gen = engine.solveBFS();
      else if (algo === 'astar') gen = engine.solveAStar();
      else if (algo === 'dijkstra') gen = engine.solveDijkstra();
      else gen = engine.solveDeadEnd();

      updateInfo('Solving...');
      runStepwise(gen, () => {
        updateInfo(engine.solutionPath.length > 0 ? 'Solved' : 'No Path Found');
      });
    }

    function setSize(w, h) {
      if (isRunning) return;
      const cleanW = Math.max(5, Math.min(75, w % 2 === 0 ? w + 1 : w));
      const cleanH = Math.max(5, Math.min(75, h % 2 === 0 ? h + 1 : h));
      engine = new MazeEngine(cleanW, cleanH);
      fitCanvas();
      generateMaze();
    }

    // Event Listeners
    btnGenerate.addEventListener('click', generateMaze);
    btnSolve.addEventListener('click', solveMaze);
    btnClear.addEventListener('click', () => {
      if (isRunning) return;
      engine.visitedNodes = [];
      engine.solutionPath = [];
      render();
      updateInfo('Path Cleared');
    });

    btnToggleCustom.addEventListener('click', () => {
      showCustom = !showCustom;
      btnToggleCustom.textContent = showCustom ? 'Use Presets' : 'Custom Size';
      presetsContainer.style.display = showCustom ? 'none' : 'grid';
      customSizeBox.classList.toggle('visible', showCustom);
    });

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setSize(parseInt(btn.dataset.w), parseInt(btn.dataset.h));
      });
    });

    btnApplySize.addEventListener('click', () => {
      const w = parseInt(inputWidth.value) || 21;
      const h = parseInt(inputHeight.value) || 21;
      setSize(w, h);
    });

    btnExportPng.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `maze_${engine.width}x${engine.height}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    btnExportJson.addEventListener('click', () => {
      const data = {
        width: engine.width,
        height: engine.height,
        start_position: engine.startPos,
        end_position: engine.endPos,
        grid: engine.grid.map(row => row.map(c => c === CellType.WALL ? '#' : c === CellType.START ? 'S' : c === CellType.END ? 'E' : ' ')),
        solution_path: engine.solutionPath.length > 0 ? engine.solutionPath : null
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `maze_${engine.width}x${engine.height}.json`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    });

    // Interactive wall drawing
    let drawing = false;
    let drawMode = CellType.WALL;

    function toggleCell(e) {
      if (isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = Math.floor(((clientX - rect.left) / rect.width) * engine.width);
      const y = Math.floor(((clientY - rect.top) / rect.height) * engine.height);
      if (x > 0 && x < engine.width - 1 && y > 0 && y < engine.height - 1) {
        if ((x === engine.startPos.x && y === engine.startPos.y) || (x === engine.endPos.x && y === engine.endPos.y)) return;
        engine.grid[y][x] = drawMode;
        render();
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * engine.width);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * engine.height);
      if (x >= 0 && x < engine.width && y >= 0 && y < engine.height) {
        drawMode = engine.grid[y][x] === CellType.WALL ? CellType.EMPTY : CellType.WALL;
      }
      toggleCell(e);
    });
    window.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mousemove', (e) => { if (drawing) toggleCell(e); });

    // Keyboard shortcuts matching gui.py
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
      const k = e.key.toLowerCase();
      if (k === 'g' || e.code === 'Space') { e.preventDefault(); generateMaze(); }
      else if (k === 's') solveMaze();
      else if (k === 'c') btnClear.click();
      else if (k === 'e') btnExportPng.click();
      else if (['1', '2', '3', '4'].includes(k)) {
        const idx = parseInt(k) - 1;
        if (presetButtons[idx]) presetButtons[idx].click();
      }
    });

    window.addEventListener('resize', fitCanvas);
    fitCanvas();
    generateMaze();
  </script>
</body>
</html>
